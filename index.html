<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <div id="entradas" class="tabs">
            <label for="cadastrar" id="botaoCadastrar">Cadastrar</label>
            <input type="radio" name="entrada" id="cadastrar" class="bolinha">

            <label for="entrar" id="botaoEntrar">Entrar</label>
            <input type="radio" name="entrada" id="entrar" class="bolinha">
        </div>
        <div id="grupoEmail">
            <label for="email">Email:</label>
            <input type="email" name="email" required class="placeHolder" id="email" placeholder="seu@email.com">
        </div>
        <div id="grupoSenha">
            <label for="senha">Senha:</label>
            <input type="password" name="senha" required class="placeHolder" id="senha" placeholder="Digite sua senha">
        </div>
        <div id="grupoPerfil">
            <label for="">Perfil:</label>
            <div id="selecaoPerfil">
                 <label for="jogador">Jogador</label>
                <input type="radio" name="perfil" id="jogador" class="bolinha" required> 
                <label for="devindie">Dev Indie</label>
                <input type="radio" name="perfil" id="devindie" class="bolinha"> 
                <label for="empresa">Empresa</label>
                <input type="radio" name="perfil" id="empresa" class="bolinha">
            </div>
        </div>
        <div id="grupoTexto">
            <textarea id="areaTexto" placeholder="Share you thoughts, experiences or a tale waiting to be told..."></textarea>
            <label for="files" id="clipe">
                <i id="iconeClipe"></i>
            </label>
            <input type="file" name="files" id="files" class="bolinha">
        </div>
        <button type="submit" id="botaoEnviar">Entrar na plataforma</button>
    </form>
</body>
</html>
